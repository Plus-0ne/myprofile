    <!-- Jquery 3.7.0 -->

    <!-- Popper js -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <!-- Bootstrap js -->
    <script src="bootstrap/js/bootstrap.min.js"></script>

    <script>
        $(function () {

            // Scroll down
            $(".scrl-dwn").on("click", function () {
                const wrapper = $('.wrapper');

                wrapper.animate({
                    scrollTop: wrapper.scrollTop() + $(window).height()
                }, 600);
            });

            // Scroll up
            $(".scrl-up").on("click", function () {
                const wrapper = $('.wrapper');

                wrapper.animate({
                    scrollTop: wrapper.scrollTop() - $(window).height()
                }, 600);
            });



        });
    </script>
